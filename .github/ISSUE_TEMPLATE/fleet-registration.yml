name: Fleet registration
description: Register a vehicle with the Steam Six fleet
labels: [fleet]
body:
  - type: markdown
    attributes:
      value: |
        Any moving thing qualifies. Paste a photo (landscape, ideally mid-flight)
        directly into the Photo field.
  - type: input
    id: reg
    attributes:
      label: Tail number
      description: Your chosen registration, e.g. N6BW. Leave blank and the registrar assigns one.
      placeholder: NX123
  - type: input
    id: type
    attributes:
      label: Vehicle type
      description: What it is mounted to. Be specific. the registry is official.
      placeholder: Big Wheel / Golf Cart / Automobile / Locomotive / etc
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: Photo
      description: Paste the image directly into this field.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Registry notes
      description: Photo notes, Flight hours, incidents, inspector commentary.
